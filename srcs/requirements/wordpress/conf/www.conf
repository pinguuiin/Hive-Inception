[www]

# The existing unprivileged user for Alpine
user = nobody
group = nobody

# Override the default where it listened on a Unix socket
listen = 9000

listen.owner = nobody
listen.group = nobody

# Dynamically scale the number of PHP-FPM worker processes
pm = dynamic
# Never have more than 5 workers
pm.max_children = 5
pm.start_servers = 2
# Keep at least 1 idle worker available
pm.min_spare_servers = 1
# If more than 3 workers are sitting idle, terminate some to save memory
pm.max_spare_servers = 3

# Allow environment variables to remain available to PHP if needed
clear_env = no
